name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Xcode Version anzeigen
        run: xcodebuild -version

      - name: iOS App bauen
        run: |
          set -o pipefail
          xcodebuild \
            -project OETTVErgebnisdienst.xcodeproj \
            -scheme OETTVErgebnisdienst \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: App verpacken
        if: success()
        run: |
          cd build/Build/Products/Release-iphoneos
          zip -r "$GITHUB_WORKSPACE/OETTVErgebnisdienst-unsigned.app.zip" OETTVErgebnisdienst.app

      - name: App als Artifact speichern
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OETTVErgebnisdienst-unsigned
          path: OETTVErgebnisdienst-unsigned.app.zip
